fields: &fields
  keyword:
    type: keyword
    ignore_above: 256
name_fields: &name_fields
  type: text
  copy_to: named
  fields: *fields

mappings:
  _default_:
    properties:
      meta:
        properties:
          created:
            properties:
              date:
                type: date
                format: yyyy-MM-dd HH:mm:ss
          modified:
            properties:
              date:
                type: date
                format: yyyy-MM-dd HH:mm:ss
      name:
        properties:
          name: *name_fields
          first: *name_fields
          last: *name_fields
      named:
        type: text
        fields: *fields
  Calls:
    properties:
      date_end:
        type: date
        format: yyyy-MM-dd HH:mm:ss
      date_start:
        type: date
        format: yyyy-MM-dd HH:mm:ss
      duration_hours:
        type: short
      duration_minutes:
        type: short








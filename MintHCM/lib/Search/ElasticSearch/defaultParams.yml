fields: &fields
  keyword:
    type: keyword
    ignore_above: 256
name_fields: &name_fields
  type: text
  copy_to: named
  fields: *fields

mappings:
  _default_:
    properties:
      meta:
        properties:
          created:
            properties:
              date:
                type: date
                format: yyyy-MM-dd HH:mm:ss||yyyy-MM-dd
          modified:
            properties:
              date:
                type: date
                format: yyyy-MM-dd HH:mm:ss||yyyy-MM-dd
      name:
        properties:
          name: *name_fields
      named:
        type: text
        fields: *fields

  Calls:
    properties:
      parent_name: 
        type: text
        fields: *fields
      date_start:
        type: date
        format: yyyy-MM-dd HH:mm:ss||yyyy-MM-dd
      date_end:
        type: date
        format: yyyy-MM-dd HH:mm:ss||yyyy-MM-dd
  Candidates:
    properties:
      address:
        properties:
          alt:
            properties:
              street:
                type: text
                fields: *fields
          primary:
            properties:
              street:
                type: text
                fields: *fields
      recr_contact_agree:
        type: boolean
      relocation:
        type: boolean
      collaboration:
        type: boolean
      last_time_contact:
        type: date
        format: yyyy-MM-dd HH:mm:ss||yyyy-MM-dd
      date_planned_contact:
        type: date
        format: yyyy-MM-dd HH:mm:ss||yyyy-MM-dd